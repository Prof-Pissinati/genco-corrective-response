# Reduced IEEE 118 dataset to train GENCO Tiny (PF mode, contingencies up to N-2): 800 load scenarios x 4 variants = 3200 samples
network:
  name: "case118_ieee"
  source: "pglib"

load:
  generator: "agg_load_profile"
  agg_profile: "default"
  scenarios: 800
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0

topology_perturbation:
  type: "random"
  k: 2
  n_topology_variants: 4
  elements: [branch, gen]

generation_perturbation:
  type: "cost_permutation"
  sigma: 1.0

admittance_perturbation:
  type: "random_perturbation"
  sigma: 0.2

settings:
  num_processes: 16
  data_dir: "./data/case118"
  large_chunk_size: 100
  overwrite: true
  mode: "pf"
  include_dc_res: true
  enable_solver_logs: true
  pf_fast: true
  dcpf_fast: true
  pf_solver: "powermodel"
  opf_formulation: "polar"
  max_iter: 200
  seed: 0
