# Builds the static demo (replay) of the interface: a single HTML with precomputed results for IEEE 14, 30, 57 and 118.
# On every push to main (and manually) it publishes the file as an artifact. In the public mirror (owner Prof-Pissinati) every push to main also publishes it to GitHub Pages;
# elsewhere, "Run workflow" with deploy_pages does it (requires Pages enabled: Settings > Pages > Source: GitHub Actions, and a public repository or a plan that allows it).
name: Replay (static demo)

on:
  push:
    branches: [main]
    paths: ['interface/**', '.github/workflows/replay.yml']
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Publish to GitHub Pages'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: interface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interface/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build:replay
      - name: Prepare the Pages folder
        run: mkdir -p pages && cp standalone/genco-replay.html pages/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: genco-replay
          path: interface/standalone/genco-replay.html
      - uses: actions/upload-pages-artifact@v3
        if: ${{ inputs.deploy_pages || (github.event_name == 'push' && github.repository_owner == 'Prof-Pissinati') }}
        with:
          path: interface/pages

  deploy:
    if: ${{ inputs.deploy_pages || (github.event_name == 'push' && github.repository_owner == 'Prof-Pissinati') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
