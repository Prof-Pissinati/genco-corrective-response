# Testes do backend (AC contra PowerModels e pandapower, DC, topologia e API) no Linux.
name: Backend (testes)

on:
  push:
    paths: ['backend/**', 'interface/src/data/**', 'interface/tests/case118_dc_ref.json', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'interface/src/data/**', 'interface/tests/case118_dc_ref.json', '.github/workflows/backend.yml']

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
